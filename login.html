<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script Demo</title>
    <style type="text/css">
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    background:url("login.gif") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    /* background:
    linear-gradient(rgba(0,0,0,.45),
    rgba(0,0,0,.45)),
    url(login.gif); */
    background: linear-gradient(rgb(0 0 0 / 35%), rgb(0 0 0 / 35%)), url(login.gif);

    background-size:cover;
    background-position:center;

}

/* Login Card */

.login-card{
    width:480px;
    padding:40px 65px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.login-card h2{
    text-align:center;
    color:#fff;
    margin-bottom:30px;
   text-transform: uppercase;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#fff;
}

input{
    width:100%;
    height:38px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:0 15px;
    font-size:16px;
}

button{
    width:100%;
    height:48px;
    border:none;
    outline:none;
    border-radius:12px;
    cursor:pointer;

    font-size:18px;
    font-weight:600;
    color:#fff;

    background:linear-gradient(135deg,#ff7a18,#ffb347);
    transition:.35s ease;
    margin-top: 16px;
}

button:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    box-shadow:0 12px 25px rgba(255,120,0,.45);

}

button:active{
    transform:scale(.98);
}

input{
    width:100%;
    height:40px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.15);
    color:#fff;
    padding:0 15px;
    font-size:16px;
}

input::placeholder{
    color:#ddd;
}
#reqname, #reqpwd {
    /* color:#ff6a00; */
    font-weight: 600;
    margin-top: 4px;
    top: 8px;
    position: relative;
     background: linear-gradient(135deg,#ff6a00,#ee0979);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
    </style>
</head>
<body>

<div class="login-card">
    <!-- Mini Project -->
    <h2> Login System</h2>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="uName" placeholder="Enter User Name"/>
        <span id="reqname"></span>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="pwd" placeholder="Enter Password">
        <span id="reqpwd"></span>
    </div>

    <button id="loginBtn">Login</button>
</div>

<script src="miniProject.js"></script>

</body>
</html>
